// App 目录 build.gradle (app/build.gradle)
plugins {
    id 'com.android.application'
}

// 发布签名配置从 gitignore 的 local.properties 读取；密钥文件本身也不入库。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("local.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseStorePath = keystoreProps.getProperty("release.keystore.file")
def hasReleaseSigning = releaseStorePath && rootProject.file(releaseStorePath).exists()
def fallbackDebugStore = new File(System.getProperty("user.home"), ".android/debug.keystore")

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.fntv.app"
        minSdkVersion 19
        targetSdkVersion 32
        versionCode 26
        versionName "1.2.6"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStorePath)
                storePassword keystoreProps.getProperty("release.keystore.password")
                keyAlias keystoreProps.getProperty("release.key.alias")
                keyPassword keystoreProps.getProperty("release.key.password")
            } else {
                // 未配置项目密钥时退回 debug 签名，保证 clone 后仍能构建 Release
                storeFile fallbackDebugStore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    dexOptions {
        preDexLibraries false
        javaMaxHeapSize "2g"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FNTV_${variant.buildType.name}_v${variant.versionName}_${generateTime()}.apk"
        }
    }
}

static def generateTime() {
    return new java.text.SimpleDateFormat("yyyyMMdd_HHmm", Locale.CHINA).format(new Date())
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'com.squareup.retrofit2:retrofit:2.6.4'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.4'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.7'
    implementation 'org.jellyfin.exoplayer:exoplayer-ffmpeg-extension:2.18.7+1'
}
